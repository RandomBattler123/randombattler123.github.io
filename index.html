<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google No AI</title>
    <link rel="search" 
          type="application/opensearchdescription+xml" 
          title="Google (No AI)" 
          href="opensearch.xml">
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
    <h2>Google Search (&tbs=1)</h2>
    <form action="https://www.google.com/search" method="get" target="_self">
        <input type="text" name="q" placeholder="Type query here..." style="padding: 10px; width: 60%;" required>
        <input type="hidden" name="tbs" value="1">
        <button type="submit" style="padding: 10px 15px;">Search</button>
    </form>
</body>
</html>
